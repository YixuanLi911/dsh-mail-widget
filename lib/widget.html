<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>未读邮件</title>
<style>
  :root {
    --bg: #101014;
    --card: rgba(24, 24, 30, 0.86);
    --line: rgba(255, 255, 255, 0.08);
    --text: #f5f5f7;
    --muted: #9b9ba4;
    --faint: #6f6f78;
    --accent: #5b8cff;
    --good: #34c759;
    --warn: #ff9f0a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: radial-gradient(1200px 600px at 20% -10%, #24304d 0%, var(--bg) 45%, #0b0b0e 100%);
    color: var(--text);
    font: 13px/1.45 -apple-system, "SF Pro Text", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  body { display: flex; align-items: flex-start; justify-content: center; padding: 28px 16px 40px; }

  .card {
    width: 100%;
    max-width: 380px;
    background: var(--card);
    backdrop-filter: blur(22px) saturate(140%);
    -webkit-backdrop-filter: blur(22px) saturate(140%);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 18px;
    padding: 14px;
    box-shadow: 0 18px 48px rgba(0, 0, 0, 0.45);
  }

  .head { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--good); }
  .dot.warn { background: var(--warn); }
  .dot.idle { background: var(--faint); }
  .head .title { font-size: 11px; letter-spacing: .4px; color: var(--muted); font-weight: 600; }
  .head .spacer { flex: 1; }
  .icon-btn {
    width: 22px; height: 22px; border: 0; border-radius: 50%;
    background: transparent; color: var(--muted); cursor: pointer;
    display: grid; place-items: center; font-size: 12px;
  }
  .icon-btn:hover { background: rgba(255,255,255,.09); color: var(--text); }

  .section + .section { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); }
  .section-head { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  .section-title { font-size: 10.5px; font-weight: 600; letter-spacing: .3px; color: var(--muted); }
  .badge {
    font-size: 9.5px; font-weight: 600; padding: 1px 5px; border-radius: 999px;
    background: rgba(255,255,255,.13); color: var(--text); font-variant-numeric: tabular-nums;
  }
  .badge.zero { background: rgba(255,255,255,.06); color: var(--faint); }

  .row {
    display: flex; gap: 8px; align-items: center;
    padding: 4px 5px; border-radius: 7px; cursor: pointer;
  }
  .row:hover { background: rgba(255,255,255,.07); }
  .avatar {
    width: 21px; height: 21px; border-radius: 50%; flex: none;
    display: grid; place-items: center; font-size: 10.5px; font-weight: 600;
  }
  .row .body { min-width: 0; flex: 1; }
  .row .line1 { display: flex; gap: 6px; align-items: baseline; }
  .row .name { font-size: 12px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .time { margin-left: auto; font-size: 9px; color: var(--faint); flex: none; }
  .row .subject { font-size: 10.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .empty { font-size: 10.5px; color: var(--faint); padding: 3px 0 3px 2px; }
  .more { font-size: 10px; color: var(--faint); padding: 3px 0 0 28px; }

  .foot { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
  .foot .status { font-size: 9.5px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ghost-btn {
    margin-left: auto; flex: none;
    border: 0; border-radius: 999px; padding: 4px 9px; cursor: pointer;
    background: rgba(255,255,255,.10); color: var(--muted);
    font-size: 9.5px; font-weight: 600;
  }
  .ghost-btn:hover:not(:disabled) { background: rgba(255,255,255,.16); color: var(--text); }
  .ghost-btn:disabled { opacity: .55; cursor: default; }

  .error {
    display: flex; gap: 7px; align-items: flex-start;
    font-size: 11.5px; color: #ffb4a8; padding: 6px 0;
  }
  .skeleton div { height: 8px; border-radius: 4px; background: rgba(255,255,255,.09); margin: 8px 0; }
  .skeleton .w1 { width: 60%; } .skeleton .w2 { width: 85%; } .skeleton .w3 { width: 70%; }

  /* 设置面板 */
  .setup label { display: block; font-size: 10.5px; color: var(--muted); margin: 10px 0 4px; }
  .setup input, .setup select {
    width: 100%; padding: 7px 9px; border-radius: 8px;
    border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.05);
    color: var(--text); font-size: 12px; outline: none;
  }
  .setup input:focus, .setup select:focus { border-color: rgba(91,140,255,.7); }
  .setup .hint { font-size: 10px; color: var(--faint); margin-top: 5px; }
  .setup .grid2 { display: grid; grid-template-columns: 1fr 88px; gap: 8px; }
  .setup .actions { display: flex; gap: 8px; margin-top: 14px; }
  .primary {
    border: 0; border-radius: 999px; padding: 7px 14px; cursor: pointer;
    background: var(--accent); color: #fff; font-size: 12px; font-weight: 600;
  }
  .primary:disabled { opacity: .6; cursor: default; }
  .secondary { background: rgba(255,255,255,.10); color: var(--text); }
  .msg { font-size: 11px; margin-top: 10px; color: var(--muted); word-break: break-word; }
  .msg.bad { color: #ffb4a8; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="card">
  <div class="head">
    <span class="dot idle" id="dot"></span>
    <span class="title">收件箱</span>
    <span class="spacer"></span>
    <button class="icon-btn" id="refresh" title="立即刷新">⟳</button>
    <button class="icon-btn" id="gear" title="设置">⚙</button>
  </div>

  <div id="main">
    <div class="skeleton"><div class="w2"></div><div class="w1"></div><div class="w3"></div></div>
  </div>

  <div class="setup hidden" id="setup">
    <label>邮箱服务商</label>
    <select id="provider"></select>
    <div class="grid2">
      <div>
        <label>IMAP 服务器</label>
        <input id="host" placeholder="imap.example.com" autocomplete="off" spellcheck="false">
      </div>
      <div>
        <label>端口</label>
        <input id="port" value="993" inputmode="numeric">
      </div>
    </div>
    <label>邮箱地址</label>
    <input id="user" placeholder="you@example.com" autocomplete="username" spellcheck="false">
    <label>密码 / 授权码</label>
    <input id="password" type="password" placeholder="应用专用密码或授权码" autocomplete="current-password">
    <div class="hint" id="hint"></div>
    <div class="actions">
      <button class="primary" id="save">保存并测试</button>
      <button class="primary secondary" id="cancel">取消</button>
    </div>
    <div class="msg" id="setupMsg"></div>
  </div>

  <div class="foot hidden" id="foot">
    <span class="status" id="status">尚未收取</span>
    <button class="ghost-btn" id="markAll">全部已读</button>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id)
const dot = $('dot'), main = $('main'), foot = $('foot'), status = $('status'), markAllBtn = $('markAll')
const setup = $('setup'), setupMsg = $('setupMsg'), hint = $('hint')
let providers = []
let timer = null
let busy = false

function avatarColor(seed) {
  let hash = 5381
  for (const ch of String(seed || '?')) hash = (hash * 33 + ch.codePointAt(0)) >>> 0
  const hues = [215, 350, 150, 30, 275, 190, 320]
  return hues[hash % hues.length]
}

function initials(name) {
  const text = String(name || '?').trim()
  return text ? Array.from(text)[0].toUpperCase() : '?'
}

function sectionHTML(title, section) {
  const items = section.items || []
  const rows = items.map((item) => `
    <div class="row" title="${escapeAttr(item.subject)}">
      <div class="avatar" style="background:hsl(${avatarColor(item.address || item.name)} 45% 32%); color:hsl(${avatarColor(item.address || item.name)} 70% 78%)">${initials(item.name)}</div>
      <div class="body">
        <div class="line1"><span class="name">${escapeHTML(item.name)}</span><span class="time">${escapeHTML(item.time || '')}</span></div>
        <div class="subject">${escapeHTML(item.subject)}</div>
      </div>
    </div>`).join('')
  const empty = section.count === 0
    ? `<div class="empty">${title.includes('7') ? '近 7 天没有未读邮件' : '近一个月没有未读邮件'}</div>`
    : ''
  const more = section.count > items.length
    ? `<div class="more">还有 ${section.count - items.length} 封未读…</div>` : ''
  return `<div class="section">
    <div class="section-head">
      <span class="section-title">${title}</span>
      <span class="badge ${section.count === 0 ? 'zero' : ''}">${section.count}</span>
    </div>
    ${rows}${empty}${more}
  </div>`
}

function escapeHTML(text) {
  return String(text ?? '').replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]))
}
function escapeAttr(text) { return escapeHTML(text).replace(/"/g, '&quot;') }

async function load() {
  if (busy) return
  busy = true
  $('refresh').textContent = '…'
  try {
    const res = await fetch('/api/state', { cache: 'no-store' })
    const data = await res.json()
    if (!data.configured) {
      showSetup(true)
      foot.classList.add('hidden')
      main.innerHTML = ''
      return
    }
    showSetup(false)
    foot.classList.remove('hidden')
    const total = data.totalUnread || 0
    dot.className = 'dot' + (total > 0 ? '' : ' idle')
    main.innerHTML = sectionHTML('近 7 天未读邮件', data.week) + sectionHTML('近一个月未读邮件', data.month)
    const time = new Date(data.updatedAt || Date.now())
    status.textContent = total > 0
      ? `共 ${total.toLocaleString('zh-CN')} 封未读 · 更新于 ${String(time.getHours()).padStart(2, '0')}:${String(time.getMinutes()).padStart(2, '0')}`
      : `没有未读邮件 · 更新于 ${String(time.getHours()).padStart(2, '0')}:${String(time.getMinutes()).padStart(2, '0')}`
    markAllBtn.disabled = total === 0
    markAllBtn.textContent = '全部已读'
  } catch (error) {
    dot.className = 'dot warn'
    main.innerHTML = `<div class="error">⚠️ ${escapeHTML(error.message || '读取失败')}</div>`
    status.textContent = '读取失败'
  } finally {
    busy = false
    $('refresh').textContent = '⟳'
  }
}

function showSetup(visible) {
  setup.classList.toggle('hidden', !visible)
  main.classList.toggle('hidden', visible)
}

async function openSettings() {
  const res = await fetch('/api/config', { cache: 'no-store' })
  const { config } = await res.json()
  if (config) {
    $('host').value = config.host || ''
    $('port').value = config.port || 993
    $('user').value = config.user || ''
  }
  $('password').value = ''
  setupMsg.textContent = ''
  showSetup(true)
}

async function save() {
  const payload = {
    host: $('host').value.trim(),
    port: Number($('port').value) || 993,
    user: $('user').value.trim(),
    password: $('password').value,
    folder: 'INBOX',
    useTLS: true,
    maxRows: 4
  }
  if (!payload.host || !payload.user || !payload.password) {
    setupMsg.className = 'msg bad'
    setupMsg.textContent = '服务器、邮箱地址、密码都要填'
    return
  }
  $('save').disabled = true
  setupMsg.className = 'msg'
  setupMsg.textContent = '正在连接…'
  try {
    const res = await fetch('/api/config', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(payload)
    })
    const data = await res.json()
    if (data.ok) {
      setupMsg.className = 'msg'
      setupMsg.textContent = data.message || '已保存'
      setTimeout(() => { showSetup(false); load() }, 700)
    } else {
      setupMsg.className = 'msg bad'
      setupMsg.textContent = data.error || '保存失败'
    }
  } catch (error) {
    setupMsg.className = 'msg bad'
    setupMsg.textContent = error.message
  } finally {
    $('save').disabled = false
  }
}

$('refresh').onclick = load
$('gear').onclick = openSettings
$('cancel').onclick = () => { showSetup(false); load() }
$('save').onclick = save
$('provider').onchange = () => {
  const provider = providers.find((item) => item.id === $('provider').value)
  if (!provider) return
  if (provider.host) $('host').value = provider.host
  $('port').value = provider.port || 993
  hint.textContent = provider.hint || ''
}
markAllBtn.onclick = async () => {
  if (!confirm('确定要把收件箱里所有未读邮件标为已读吗？此操作不可撤销。')) return
  markAllBtn.disabled = true
  markAllBtn.textContent = '标记中…'
  try {
    const res = await fetch('/api/mark-all-read', { method: 'POST' })
    const data = await res.json()
    if (!res.ok) throw new Error(data.error || '标记失败')
    await load()
  } catch (error) {
    status.textContent = '标记失败：' + error.message
    markAllBtn.disabled = false
    markAllBtn.textContent = '全部已读'
  }
}

fetch('/api/presets').then((res) => res.json()).then((data) => {
  providers = data.providers || []
  $('provider').innerHTML = providers.map((item) => `<option value="${item.id}">${escapeHTML(item.label)}</option>`).join('')
}).catch(() => {})

load()
timer = setInterval(() => { if (!document.hidden) load() }, 60000)
</script>
</body>
</html>
